<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inferno Books</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b090a;
            color: #f5f1f2;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 70px 25px 55px;
            text-align: center;
            background:
                radial-gradient(circle at top, #4a1024 0%, #1c0b11 38%, #0b090a 75%);
            border-bottom: 1px solid #431323;
        }

        header h1 {
            font-size: clamp(34px, 6vw, 64px);
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .subtitle {
            margin-top: 14px;
            color: #bda9af;
            font-size: 16px;
        }

        main {
            width: min(1200px, 92%);
            margin: 0 auto;
            padding: 50px 0 80px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .topbar h2 {
            font-size: 28px;
        }

        .search {
            width: 280px;
            max-width: 100%;
            padding: 13px 16px;
            border-radius: 30px;
            border: 1px solid #49202d;
            background: #151013;
            color: white;
            outline: none;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .filter {
            padding: 9px 15px;
            border-radius: 30px;
            border: 1px solid #49202d;
            background: #151013;
            color: #ddd;
            cursor: pointer;
        }

        .filter:hover {
            background: #6b1834;
            color: white;
        }

        .library {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 28px;
        }

        .book {
            background: #151013;
            border: 1px solid #29181e;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.25s;
        }

        .book:hover {
            transform: translateY(-7px);
            border-color: #7e2342;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.4);
        }

        .cover {
            aspect-ratio: 2 / 3;
            background:
                linear-gradient(145deg, #671d39, #17080d);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .book-info {
            padding: 17px;
        }

        .book-title {
            font-size: 19px;
            margin-bottom: 6px;
        }

        .author {
            color: #a9959b;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .tag {
            background: #421426;
            color: #e6ccd5;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
        }

        .read {
            display: block;
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 8px;
            background: #871f46;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .read:hover {
            background: #a92856;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: #716269;
            border-top: 1px solid #201417;
        }
    </style>
</head>

<body>

<header>
    <h1>INFERNO BOOKS</h1>
    <p class="subtitle">Я знаю, что вы читали прошлым летом</p>
</header>

<main>

    <div class="topbar">
        <h2>Библиотека</h2>
        <input class="search" type="text" placeholder="Поиск книги...">
  
    </div>
<div class="filters">
    <button class="filter">Все</button>
    <button class="filter">Триллеры/детективы</button>
    <button class="filter">Хорроры</button>
    <button class="filter">Сплаттерпанки</button>
    <button class="filter">Дарк Романы</button>
    <button class="filter">Дарк Фэнтези</button>
</div>
   
    <section class="library">

        <article class="book">
            <div class="cover">INHUMANE</div>

            <div class="book-info">
                <h3 class="book-title">Inhumane</h3>
                <p class="author">Lady GoreWhxre</p>

                <div class="tags">
                    <span class="tag">Splatterpunk</span>
                    <span class="tag">Horror</span>
                </div>

                <button class="read">Читать</button>
            </div>
        </article>

        <article class="book">
            <div class="cover">COMING SOON</div>

            <div class="book-info">
                <h3 class="book-title">Следующий перевод</h3>
                <p class="author">Скоро в библиотеке</p>

                <div class="tags">
                    <span class="tag">Dark Romance</span>
                </div>

                <button class="read">Скоро</button>
            </div>
        </article>

    </section>

</main>

<footer>
    Inferno Books · 2026
</footer>

</body>
</html>
