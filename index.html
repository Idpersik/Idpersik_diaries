<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idpersik Diaries</title>

<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:60px 20px;
    background:#1a1a1a;
}

h1{
    font-size:48px;
    margin:0;
    color:#ff4d6d;
}

.subtitle{
    color:#bbb;
    margin-top:10px;
}

.library{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:30px;
    padding:40px;
}

.book{
    background:#1b1b1b;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.cover{
    width:100%;
    height:320px;
    background:#333;
    border-radius:10px;
    margin-bottom:15px;
}

.book h2{
    margin:10px 0;
}

.tag{
    display:inline-block;
    background:#8b0000;
    padding:5px 10px;
    border-radius:20px;
    margin:3px;
    font-size:12px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#ff4d6d;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>IDPERSIK DIARIES</h1>
    <p class="subtitle">Моя библиотека переводов</p>
</header>

<section class="library">

    <div class="book">
        <div class="cover"></div>
        <h2>Первая книга</h2>
        <span class="tag">Horror</span>
        <span class="tag">Dark Romance</span>
        <br>
        <button>Читать</button>
    </div>

    <div class="book">
        <div class="cover"></div>
        <h2>Вторая книга</h2>
        <span class="tag">Splatterpunk</span>
        <span class="tag">Thriller</span>
        <br>
        <button>Читать</button>
    </div>

</section>

</body>
</html>
